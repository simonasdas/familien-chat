app = "familien-chat"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  HOSTNAME = "0.0.0.0"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "data_volume"
  destination = "/app/data"

[machines]
  auto_destroy = false
  restart = "always"

[checks]
  [checks.http]
    port = 3000
    path = "/"
    method = "GET"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
